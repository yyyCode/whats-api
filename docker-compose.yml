# 零必填环境变量：docker compose up 就能起来（SQLite + 进程内缓存）。
# 需要多实例共享配置时，把下面的 postgres / redis 取消注释并配上对应变量。
services:
  whats-api:
    build: .
    image: whats-api:m0
    ports:
      - "3000:3000"
    environment:
      NODE_NAME: compose-local
      # 单机默认：SQLite 文件落在卷里。
      # 多实例共享配置时改成同一个外部库（并取消注释下面的 postgres 服务）：
      # SQL_DSN: postgres://postgres:postgres@postgres:5432/whats_api?sslmode=disable
      # 多实例共享缓存（不配则退化为各实例自己的进程内缓存）：
      # REDIS_CONN_STRING: redis://redis:6379
      # 多实例场景下调小同步间隔，配置收敛更快（最小 5 秒）：
      # SYNC_FREQUENCY: "5"
      # 只有 master 执行迁移；多实例时其余节点设成 slave：
      # NODE_TYPE: master
    volumes:
      - whats-api-data:/data
    restart: unless-stopped

  # ---- 可选：多实例共享（默认关闭）----
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: whats_api
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped

volumes:
  whats-api-data:
  # postgres-data:
